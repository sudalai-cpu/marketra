{% extends 'marketra/dashboard/dashboard_base.html' %}

{% block dashboard_content %}
<div>
    <h2 class="text-xl font-bold text-text-dark mb-4">Order Tracking Center</h2>

    <div class="card mb-6">
        <!-- Search/Filter Header -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
            <div class="relative w-full sm:w-64">
                <input type="text" placeholder="Search orders..."
                    class="w-full pl-10 pr-4 py-2 bg-secondary-bg border-none rounded-md text-sm">
                <span class="absolute left-3 top-2.5 text-gray-400">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </span>
            </div>
            <select class="bg-white border border-gray-200 rounded-md text-sm px-3 py-2 text-text-medium">
                <option>All Past 6 Months</option>
                <option>2025</option>
                <option>2024</option>
            </select>
        </div>

        <!-- Orders List -->
        <div class="space-y-4">
            <!-- Mockup Order Item (Simulating an empty state or example) -->
            <!-- If we had real orders, we would loop here. For now, showing empty state if no variable passed, or static example if desired. -->
            <!-- Using empty state for strict adherence to "no order model yet", but keeping the UI structure ready. -->

            <div class="text-center py-12">
                <div
                    class="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-primary">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-medium text-text-dark mb-1">No orders yet</h3>
                <p class="text-text-muted text-sm mb-6">Looks like you haven't bought anything yet. Discover our latest
                    collection.</p>
                <a href="{% url 'marketra:featured' %}" class="btn-primary text-sm">Start Shopping</a>
            </div>

            <!-- Example of what an order row would look like (Hidden or Commented for reference) -->
            <!-- 
            <div class="border border-gray-100 rounded-lg p-4 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-secondary-bg transition-colors">
                <div class="flex items-center space-x-4">
                    <div class="w-16 h-16 bg-gray-100 rounded-md"></div>
                    <div>
                        <p class="font-bold text-text-dark mb-1">Order #12345</p>
                        <p class="text-xs text-text-muted">Placed on Oct 24, 2025</p>
                        <p class="text-sm font-medium mt-1">$120.00 • 2 Items</p>
                    </div>
                </div>
                <div class="flex flex-col sm:items-end gap-2">
                    <span class="badge-success">Delivered</span>
                    <a href="#" class="text-sm text-primary font-medium hover:underline">View Details</a>
                </div>
            </div> 
            -->
        </div>
    </div>
</div>
{% endblock %}
