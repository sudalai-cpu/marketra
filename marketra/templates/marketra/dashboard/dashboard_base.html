{% extends 'marketra/base.html' %}

{% block title %}Dashboard - Marketra.ai{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-col md:flex-row gap-8">
        <!-- Dashboard Sidebar -->
        <div class="w-full md:w-64 flex-shrink-0">
            <div class="bg-white rounded-lg shadow-soft border border-gray-100 p-6 sticky top-24">
                <div class="flex items-center space-x-3 mb-8">
                    <div class="w-10 h-10 bg-primary/10 rounded-full flex items-center justify-center text-primary">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <div>
                        <p class="font-bold text-text-dark">{{ user.username }}</p>
                        <p class="text-xs text-text-muted">Member</p>
                    </div>
                </div>
                
                <nav class="space-y-1">
                    <a href="{% url 'marketra:dashboard' %}" class="flex items-center space-x-3 px-4 py-2.5 rounded-md transition-colors {% if request.resolver_match.url_name == 'dashboard' %}bg-secondary-bg text-primary font-medium{% else %}text-text-medium hover:bg-gray-50 hover:text-text-dark{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        <span>Overview</span>
                    </a>
                    <a href="{% url 'marketra:orders' %}" class="flex items-center space-x-3 px-4 py-2.5 rounded-md transition-colors {% if request.resolver_match.url_name == 'orders' %}bg-secondary-bg text-primary font-medium{% else %}text-text-medium hover:bg-gray-50 hover:text-text-dark{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span>Orders</span>
                    </a>
                    <a href="{% url 'marketra:wishlist' %}" class="flex items-center space-x-3 px-4 py-2.5 rounded-md transition-colors {% if request.resolver_match.url_name == 'wishlist' %}bg-secondary-bg text-primary font-medium{% else %}text-text-medium hover:bg-gray-50 hover:text-text-dark{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                        <span>Wishlist</span>
                    </a>
                    <div class="pt-4 pb-2">
                        <p class="px-4 text-xs font-semibold text-text-muted uppercase tracking-wider">Settings</p>
                    </div>
                    <a href="{% url 'marketra:profile' %}" class="flex items-center space-x-3 px-4 py-2.5 rounded-md transition-colors {% if request.resolver_match.url_name == 'profile' %}bg-secondary-bg text-primary font-medium{% else %}text-text-medium hover:bg-gray-50 hover:text-text-dark{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span>Profile & Address</span>
                    </a>
                    <a href="{% url 'marketra:style_profile' %}" class="flex items-center space-x-3 px-4 py-2.5 rounded-md transition-colors {% if request.resolver_match.url_name == 'style_profile' %}bg-secondary-bg text-primary font-medium{% else %}text-text-medium hover:bg-gray-50 hover:text-text-dark{% endif %}">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path></svg>
                        <span>AI Style Profile</span>
                        <span class="ml-auto badge-ai">New</span>
                    </a>
                </nav>
            </div>
        </div>
        
        <!-- Dashboard Content -->
        <div class="flex-grow">
            {% block dashboard_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
